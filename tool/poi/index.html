<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Mapbox Point Layer from GitHub</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <!-- Load Mapbox GL JS -->
    <link href="https://mapbox.com" rel="stylesheet">
    <script src="https://mapbox.com"></script>
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    </style>
</head>
<body>

<div id="map"></div>

<script>
    // Replace with your actual Mapbox Access Token
    mapboxgl.accessToken = 'pk.eyJ1IjoicmNmZHRvb2xzIiwiYSI6ImNtdWFhZTNybjFjY2wzNG9rb2tydjF1cjUifQ.xYlv5HxHl_bT_fnu8RnHQg';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v12', // Map style
        center: [-74.0060, 40.7128], // Starting position [lng, lat]
        zoom: 3 // Starting zoom
    });

    map.on('load', () => {
        // Add the GeoJSON source using your GitHub Raw URL
        map.addSource('github-points', {
            type: 'geojson',
            data: 'https://github.com/rcfdtools/rcfdtools/blob/main/tool/poi/poi_picture.geojson' // Replace with your URL
        });

        // Add a layer to style and display the points
        map.addLayer({
            id: 'points-layer',
            type: 'circle',
            source: 'github-points',
            paint: {
                'circle-radius': 6,
                'circle-color': '#B42222',
                'circle-stroke-width': 1,
                'circle-stroke-color': '#fff'
            }
        });
    });
</script>

</body>
</html>
